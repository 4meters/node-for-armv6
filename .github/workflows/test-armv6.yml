name: Test Node.js ARMv6 binary

on:
  workflow_dispatch:
  # Run after build workflow completes
  workflow_run:
    workflows: ["Build Node.js (v24.x+) for ARMv6"]
    types:
      - completed

jobs:
  test:
    runs-on: ubuntu-latest
    # Only run tests if build succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 120

    steps:
      - name: Install QEMU for ARMv6 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static \
            qemu-user \
            binfmt-support
          # Register ARM binfmt so the kernel runs ARM binaries via QEMU
          sudo update-binfmts --enable qemu-arm
          # Verify QEMU works
          qemu-arm-static --version

      - name: Download node binary from release
        run: |
          # Auto-detect latest release tag e.g. v26.3.0-armv6zk
          RELEASE_TAG=$(gh release list --repo ${{ github.repository }}  --limit 1 --json tagName -q '.[0].tagName')
          echo "Latest release: $RELEASE_TAG"

          # Extract node version: v26.3.0-armv6zk -> 26.3.0
          NODE_VERSION=$(echo "$RELEASE_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_ENV
          echo "NODE_BIN=/tmp/v${NODE_VERSION}/bin/node" >> $GITHUB_ENV
          echo "NPM_BIN=/tmp/v${NODE_VERSION}/bin/npm" >> $GITHUB_ENV

          # List available assets for debugging
          echo "=== Available assets in $RELEASE_TAG ==="
          gh release view "$RELEASE_TAG" --repo ${{ github.repository }} --json assets -q '.assets[].name'

          # Find the tar.gz asset name (may vary slightly between builds)
          # NOTE: confirm this matches whatever your build script actually names the
          # tarball (build-armv6.sh currently produces "node-v${NODE_VERSION}-linux-armv6.tar.gz",
          # i.e. no trailing "l" — adjust the grep pattern below to match if so.
          ASSET_NAME=$(gh release view "$RELEASE_TAG" --repo ${{ github.repository }} --json assets -q '.assets[].name' \
            | grep -E "linux-armv6zk?\.tar\.gz" | head -1)

          if [ -z "$ASSET_NAME" ]; then
            echo "ERROR: No linux-armv6(l).tar.gz asset found in release $RELEASE_TAG"
            exit 1
          fi

          echo "Downloading: $ASSET_NAME"
          gh release download "$RELEASE_TAG" --repo ${{ github.repository }} --pattern "$ASSET_NAME" --dir /tmp
          tar -xzf "/tmp/$ASSET_NAME" -C /tmp/

          # Find extracted folder (v26.3.0 or similar)
          NODE_DIR=$(find /tmp -maxdepth 1 -name "v${NODE_VERSION}" -type d | head -1)
          if [ -z "$NODE_DIR" ]; then
            # fallback: find any vX.Y.Z dir
            NODE_DIR=$(find /tmp -maxdepth 1 -name "v[0-9]*" -type d | head -1)
          fi
          echo "Extracted to: $NODE_DIR"
          echo "NODE_BIN=$NODE_DIR/bin/node" >> $GITHUB_ENV
          echo "NPM_BIN=$NODE_DIR/bin/npm" >> $GITHUB_ENV

          echo "=== bin contents and symlinks ==="
          ls -la "$NODE_DIR/bin/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Node.js source for test suite
        run: |
          # Clone the matching branch for the detected version
          # v26.6.0 -> major 26 -> branch v26.x
          MAJOR=$(echo "$NODE_VERSION" | cut -d. -f1)
          git clone --branch "v${MAJOR}.x" --single-branch --depth=1 https://github.com/nodejs/node.git /tmp/node-src
          echo "NODE_SRC=/tmp/node-src" >> $GITHUB_ENV

      - name: Install tttapa ARMv6 toolchain sysroot for QEMU
        run: |
          # We need ARM libc for QEMU to run the binary.
          # Since we built with -static-libstdc++ -static-libgcc only libc
          # needs to be present at runtime. We get it from the tttapa sysroot
          # which is already downloaded — no multiarch apt needed.
          # (dpkg --add-architecture armhf fails on Noble GitHub runners because
          # ports.ubuntu.com armhf packages are not available via security.ubuntu.com)
          wget -q https://github.com/tttapa/toolchains/releases/download/1.3.1/x-tools-armv6-rpi-linux-gnueabihf-gcc13.tar.xz
          mkdir -p /opt/tttapa-toolchains
          tar -xf x-tools-armv6-rpi-linux-gnueabihf-gcc13.tar.xz \
            --strip-components=1 \
            -C /opt/tttapa-toolchains \
            x-tools/armv6-rpi-linux-gnueabihf

          # The sysroot contains ARM libc — point QEMU at it
          SYSROOT=/opt/tttapa-toolchains/armv6-rpi-linux-gnueabihf/armv6-rpi-linux-gnueabihf/sysroot
          echo "=== Sysroot lib contents ==="
          ls "$SYSROOT/lib/" | head -20
          echo "QEMU_LD_PREFIX=$SYSROOT" >> $GITHUB_ENV

      - name: Smoke test - basic functionality
        run: |
          NODE="$NODE_BIN"
          # -cpu arm1176 matches the real Pi 1/Zero SoC (ARM1176JZF-S, ARMv6KZ)
          # so emulation reflects actual target hardware capabilities rather
          # than QEMU's more permissive default ARM CPU model.
          echo "=== Node version ==="
          qemu-arm-static -cpu arm1176 $NODE --version

          echo "=== Basic JS execution ==="
          qemu-arm-static -cpu arm1176 $NODE -e "console.log('hello from armv6')"

          echo "=== Math ==="
          qemu-arm-static -cpu arm1176 $NODE -e "console.log(2 ** 32)"

          echo "=== Buffer ==="
          qemu-arm-static -cpu arm1176 $NODE -e "console.log(Buffer.from('hello').toString('hex'))"

          echo "=== async/await ==="
          qemu-arm-static -cpu arm1176 $NODE -e "
            (async () => {
              const result = await Promise.resolve(42);
              console.log('async result:', result);
            })();
          "

          echo "=== require ==="
          qemu-arm-static -cpu arm1176 $NODE -e "
            const os = require('os');
            console.log('arch:', os.arch());
            console.log('platform:', os.platform());
          "

      - name: Test npm
        run: |
          NODE="$NODE_BIN"
          NPM="$NPM_BIN"

          echo "=== npm version ==="
          qemu-arm-static -cpu arm1176 $NODE $NPM --version

          echo "=== npm install test ==="
          mkdir -p /tmp/npm-test
          cd /tmp/npm-test
          qemu-arm-static -cpu arm1176 $NODE $NPM init -y
          qemu-arm-static -cpu arm1176 $NODE $NPM install lodash --prefer-offline 2>&1 | tail -5
          # Verify installed module works
          qemu-arm-static -cpu arm1176 $NODE -e "
            const _ = require('/tmp/npm-test/node_modules/lodash');
            console.log('lodash chunk:', _.chunk([1,2,3,4], 2));
          "

      - name: Run official Node test suite (parallel subset)
        run: |
          NODE="$NODE_BIN"
          cd "$NODE_SRC"

          # Run a subset of the parallel tests - avoid ones that need
          # network, native addons, or are timing-sensitive under QEMU.
          # QEMU is ~5-10x slower than native (and armv6 has no NEON, so
          # expect this to run noticeably slower than the armv7 equivalent)
          # so timeouts need adjusting.
          # test.py --shell expects a single executable.
          # Create a wrapper script that invokes node via QEMU.
          printf '#!/bin/bash\nexec qemu-arm-static -cpu arm1176 "%s" "$@"\n' "$NODE_BIN" > /tmp/node-qemu
          chmod +x /tmp/node-qemu

          cd "$NODE_SRC"
          python3 tools/test.py --shell=/tmp/node-qemu --mode=release --timeout=180 \
            test/parallel/test-assert* \
            test/parallel/test-buffer* \
            test/parallel/test-es6* \ 
            test/parallel/test-timers* \
            test/parallel/test-util* \
            2>&1 | tail -50 || true
          echo "=== Test run complete ==="

      - name: Run Node's own test runner (lighter subset)
        run: |
          NODE="$NODE_BIN"
          cd "$NODE_SRC"

          # Alternatively, run individual known-good tests directly
          # These cover core JS engine correctness
          TESTS=(
            "$NODE_SRC/test/parallel/test-assert.js"
            "$NODE_SRC/test/parallel/test-buffer-alloc.js"
            "$NODE_SRC/test/parallel/test-buffer-from.js"
            "$NODE_SRC/test/parallel/test-es6-arrow-functions.js"
            "$NODE_SRC/test/parallel/test-es6-destructuring.js"
            "$NODE_SRC/test/parallel/test-es6-generators.js"
            "$NODE_SRC/test/parallel/test-es6-map.js"
            "$NODE_SRC/test/parallel/test-es6-promise.js"
            "$NODE_SRC/test/parallel/test-es6-set.js"
            "$NODE_SRC/test/parallel/test-es6-template-strings.js"
            "$NODE_SRC/test/parallel/test-stream2-basic.js"
            "$NODE_SRC/test/parallel/test-timers-immediate.js"
            "$NODE_SRC/test/parallel/test-util-format.js"
            "$NODE_SRC/test/parallel/test-v8-coverage.js"
          )

          PASS=0
          FAIL=0
          for t in "${TESTS[@]}"; do
            if [ -f "$t" ]; then
              if qemu-arm-static -cpu arm1176 $NODE "$t" > /dev/null 2>&1; then
                echo "PASS: $t"
                PASS=$((PASS+1))
              else
                echo "FAIL: $t"
                FAIL=$((FAIL+1))
              fi
            fi
          done

          echo ""
          echo "=== Results: $PASS passed, $FAIL failed ==="
          [ $FAIL -eq 0 ] || exit 1